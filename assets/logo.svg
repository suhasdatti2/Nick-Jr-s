<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nick Jr's Burgers and Gyros logo">
  <defs>
    <linearGradient id="bunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b860"/>
      <stop offset="1" stop-color="#c97b1f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d12b1f"/>
      <stop offset="1" stop-color="#8c1209"/>
    </linearGradient>
  </defs>

  <!-- Outer badge -->
  <circle cx="100" cy="100" r="96" fill="#1c1a17"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" fill="#26221d"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#f0b860" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Burger icon -->
  <g transform="translate(100 92)">
    <!-- top bun -->
    <path d="M-40 -6 A40 34 0 0 1 40 -6 Z" fill="url(#bunGrad)"/>
    <circle cx="-18" cy="-22" r="2.4" fill="#fff4dd"/>
    <circle cx="2" cy="-27" r="2.4" fill="#fff4dd"/>
    <circle cx="20" cy="-21" r="2.4" fill="#fff4dd"/>
    <!-- lettuce -->
    <path d="M-42 -2 q10 8 21 0 q10 8 21 0 q10 8 21 0 q10 8 21 0 l0 5 l-84 0 Z" fill="#5fa052"/>
    <!-- patty -->
    <rect x="-40" y="2" width="80" height="11" rx="5.5" fill="#5a3320"/>
    <!-- bottom bun -->
    <path d="M-38 14 l76 0 q4 0 4 5 q-42 12 -84 0 q0 -5 4 -5 Z" fill="url(#bunGrad)"/>
  </g>

  <!-- Text -->
  <path id="topArc" d="M30 100 A70 70 0 0 1 170 100" fill="none"/>
  <path id="botArc" d="M34 116 A66 66 0 0 0 166 116" fill="none"/>
  <text fill="#f0b860" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15.5" letter-spacing="1.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">NICK JR'S</textPath>
  </text>
  <text fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="11.5" letter-spacing="2">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">BURGERS &amp; GYROS</textPath>
  </text>
</svg>
