<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nick's Jr. Burgers and Gyros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9e1c12"/>
      <stop offset="0.46" stop-color="#c62a1c"/>
      <stop offset="1" stop-color="#7d140c"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#bg)"/>
  <g font-family="'Pacifico', 'Brush Script MT', cursive" font-style="italic" text-anchor="middle">
    <!-- 3D extrude -->
    <text x="158" y="98" font-size="92" fill="#530c07" transform="translate(6,8)">Nick's</text>
    <text x="206" y="170" font-size="64" fill="#530c07" transform="translate(6,8)">Jr.</text>
    <!-- white face with dark outline -->
    <text x="158" y="98" font-size="92" fill="#ffffff" stroke="#4a0a06" stroke-width="2.4" paint-order="stroke">Nick's</text>
    <text x="206" y="170" font-size="64" fill="#ffffff" stroke="#4a0a06" stroke-width="2.4" paint-order="stroke">Jr.</text>
  </g>
</svg>
